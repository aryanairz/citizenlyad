name: Quality Control Creative Ads

on:
  workflow_dispatch:

jobs:
  stills:
    name: Inspect ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - language: german
            composition: CitizenlyGermanCreativeAd
          - language: dutch
            composition: CitizenlyDutchCreativeAd
          - language: swedish
            composition: CitizenlySwedishCreativeAd
          - language: norwegian
            composition: CitizenlyNorwegianCreativeAd
          - language: danish
            composition: CitizenlyDanishCreativeAd
          - language: italian
            composition: CitizenlyItalianCreativeAd
          - language: portuguese
            composition: CitizenlyPortugueseCreativeAd
          - language: catalan
            composition: CitizenlyCatalanCreativeAd
          - language: indonesian
            composition: CitizenlyIndonesianCreativeAd
          - language: tagalog
            composition: CitizenlyTagalogCreativeAd
          - language: finnish
            composition: CitizenlyFinnishCreativeAd

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx remotion browser ensure
      - run: npm run typecheck

      - name: Render storyboard checkpoints
        shell: bash
        run: |
          mkdir -p "qc/${{ matrix.language }}"
          for frame in 45 145 270 390; do
            npx remotion still \
              "${{ matrix.composition }}" \
              "qc/${{ matrix.language }}/frame-${frame}.png" \
              --frame="$frame"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: storyboard-pngs-${{ matrix.language }}
          path: qc/${{ matrix.language }}/*.png
          if-no-files-found: error
          retention-days: 7
