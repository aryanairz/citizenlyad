name: Render Citizenly Creative Ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/compositions/campaign3/**"
      - "src/Root.tsx"
      - ".github/workflows/render-creative-ads.yml"

jobs:
  render:
    name: Render ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - language: german
            composition: CitizenlyGermanCreativeAd
          - language: dutch
            composition: CitizenlyDutchCreativeAd
          - language: swedish
            composition: CitizenlySwedishCreativeAd
          - language: norwegian
            composition: CitizenlyNorwegianCreativeAd
          - language: danish
            composition: CitizenlyDanishCreativeAd
          - language: italian
            composition: CitizenlyItalianCreativeAd
          - language: portuguese
            composition: CitizenlyPortugueseCreativeAd
          - language: catalan
            composition: CitizenlyCatalanCreativeAd
          - language: indonesian
            composition: CitizenlyIndonesianCreativeAd
          - language: tagalog
            composition: CitizenlyTagalogCreativeAd
          - language: finnish
            composition: CitizenlyFinnishCreativeAd

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Type-check
        run: npm run typecheck

      - name: Render creative ad
        run: >-
          npx remotion render
          ${{ matrix.composition }}
          out/citizenly-${{ matrix.language }}-creative-ad.mp4
          --codec=h264
          --concurrency=2

      - name: Verify video
        run: test -s "out/citizenly-${{ matrix.language }}-creative-ad.mp4"

      - name: Upload video
        uses: actions/upload-artifact@v5
        with:
          name: citizenly-${{ matrix.language }}-creative-ad
          path: out/citizenly-${{ matrix.language }}-creative-ad.mp4
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle all MP4 videos
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered videos
        uses: actions/download-artifact@v5
        with:
          pattern: citizenly-*-creative-ad
          path: videos
          merge-multiple: true

      - name: Verify MP4 bundle
        run: |
          test "$(find videos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 11
          find videos -maxdepth 1 -name '*.mp4' -type f -size +0

      - name: Upload MP4-only bundle
        uses: actions/upload-artifact@v5
        with:
          name: DOWNLOAD-ALL-11-MP4-VIDEOS
          path: videos/*.mp4
          if-no-files-found: error
          retention-days: 14
